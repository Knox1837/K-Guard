<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Guard Live Security Monitor</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vis-network@9.1.2/dist/dist/vis-network.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }
        
        #header {
            background: #2a2a2a;
            padding: 15px 30px;
            border-bottom: 2px solid #3a3a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #00ff88;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.connected {
            background: #00ff88;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        #stats {
            display: flex;
            gap: 30px;
            font-size: 14px;
        }
        
        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .stat-label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 600;
            color: #00ff88;
        }
        
        #controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        button {
            background: #3a3a3a;
            border: 1px solid #4a4a4a;
            color: #fff;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #4a4a4a;
            border-color: #00ff88;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        button.active {
            background: #00ff88;
            color: #1a1a1a;
            border-color: #00ff88;
        }
        
        #graph-container {
            width: 100%;
            height: calc(100vh - 80px);
            background: #1a1a1a;
        }
        
        #connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2a2a2a;
            padding: 15px 20px;
            border-radius: 8px;
            border: 2px solid #ff4444;
            display: none;
            z-index: 1000;
        }
        
        #connection-status.show {
            display: block;
        }
        
        .legend {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(42, 42, 42, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
            font-size: 12px;
        }
        
        .legend-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #00ff88;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }
        
        #event-log {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 350px;
            max-height: 200px;
            background: rgba(42, 42, 42, 0.95);
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            font-size: 11px;
            font-family: 'Courier New', monospace;
        }
        
        .event-entry {
            padding: 5px;
            border-bottom: 1px solid #2a2a2a;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        .event-entry.security {
            color: #ff4444;
            font-weight: bold;
        }
        
        .event-entry.network {
            color: #87ceeb;
        }
        
        .event-entry.file {
            color: #90ee90;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>
            <div class="status-indicator" id="status-indicator"></div>
            K-Guard Live Monitor
        </h1>
        <div id="stats">
            <div class="stat">
                <div class="stat-label">Nodes</div>
                <div class="stat-value" id="node-count">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Edges</div>
                <div class="stat-value" id="edge-count">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Events</div>
                <div class="stat-value" id="event-count">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Events/sec</div>
                <div class="stat-value" id="event-rate">0</div>
            </div>
        </div>
        <div id="controls">
            <button id="pause-btn" onclick="togglePause()">⏸ Pause</button>
            <button onclick="clearGraph()">🗑 Clear</button>
            <button onclick="resetZoom()">🔍 Reset View</button>
            <button id="physics-btn" onclick="reflowGraph()">🔄 Re-flow</button>
        </div>
    </div>
    
    <div id="connection-status">
        ⚠️ Disconnected from server. Attempting to reconnect...
    </div>
    
    <div id="graph-container"></div>
    
    <div class="legend">
        <div class="legend-title">Security Risk Levels</div>
        <div class="legend-item">
            <div class="legend-color" style="background: #97C2FC;"></div>
            <span>Benign (0)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #FFD700;"></div>
            <span>Low Risk (1-29)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #FF8C00;"></div>
            <span>Medium Risk (30-99)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #FF0000;"></div>
            <span>High Risk (100+)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #90EE90;"></div>
            <span>Files</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #87CEEB;"></div>
            <span>Network</span>
        </div>
    </div>
    
    <div id="event-log"></div>

    <script>
        // WebSocket connection with reconnection logic
        const socket = io('http://localhost:5000', {
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000,
            reconnectionAttempts: Infinity,
            timeout: 20000,
            transports: ['websocket', 'polling']
        });
        
        // Graph data
        let nodes = new vis.DataSet();
        let edges = new vis.DataSet();
        let isPaused = false;
        let queuedUpdates = [];
        let reconnectAttempts = 0;
        let lastUpdateTime = Date.now();
        
        // Batch processing for performance
        let updateBatch = { nodes: [], edges: [], timestamp: Date.now() };
        let batchTimeout = null;
        const BATCH_DELAY_MS = 100; // Process updates every 100ms
        
        // Initialize vis.js network
        const container = document.getElementById('graph-container');
        const data = { nodes: nodes, edges: edges };
        // NOTE ON LAYOUT STRATEGY:
        // This graph is a DAG — every edge originates FROM a process node
        // (FORKED -> process, EXECUTES/OPENS/CONNECTED_TO -> file/socket).
        // That structural guarantee means we get a clean, readable layout
        // basically for free via vis-network's hierarchical mode (one
        // topological pass), instead of paying for a continuous n-body
        // physics simulation across the whole graph every frame. Physics
        // is fully OFF; "liveliness" comes from a lightweight pop-in
        // animation on newly inserted nodes only (see popInNode below),
        // not from moving the rest of the graph.
        const options = {
            layout: {
                improvedLayout: true,
                randomSeed: 42
            },
            physics: {
                enabled: true,
                solver: 'forceAtlas2Based',
                forceAtlas2Based: {
                    gravitationalConstant: -60,
                    centralGravity: 0.008,
                    springLength: 110,
                    springConstant: 0.06,
                    damping: 0.45,
                    avoidOverlap: 0.6
                },
                stabilization: { enabled: true, iterations: 150, updateInterval: 25, fit: true },
                minVelocity: 1.0,
                adaptiveTimestep: true,
                timestep: 0.5
            },
            nodes: {
                shape: 'dot',
                font: {
                    size: 12,
                    color: '#ffffff',
                    face: 'Arial',
                    strokeWidth: 2,
                    strokeColor: '#000000'
                },
                borderWidth: 2,
                borderWidthSelected: 4,
                shadow: false  // Disable shadows for performance
            },
            edges: {
                arrows: {
                    to: {
                        enabled: true,
                        scaleFactor: 0.6,
                        type: 'arrow'
                    }
                },
                color: {
                    color: '#555555',
                    highlight: '#00ff88',
                    hover: '#00ff88',
                    inherit: false
                },
                width: 1.5,
                // Cheap fixed-formula curve (not physics) — hierarchical
                // layouts read much better with a light bezier than dead-straight lines.
                smooth: { enabled: true, type: 'dynamic' },
                shadow: false
            },
            interaction: {
                hover: true,
                tooltipDelay: 200,
                navigationButtons: true,
                keyboard: true,
                zoomView: true,
                dragView: true,
                hideEdgesOnDrag: true,  // Hide edges while dragging
                hideEdgesOnZoom: true,  // Hide edges while zooming
                hideNodesOnDrag: false
            },
            configure: {
                enabled: false
            }
        };
        const network = new vis.Network(container, data, options);
        // Physics: stabilize once, then freeze. Thaw briefly on new nodes. 
        let physicsFrozen = false;
        network.once('stabilizationIterationsDone', () => {
            network.setOptions({ physics: { enabled: false } });
            physicsFrozen = true;
        });

        let thawTimeout = null;
        function thawPhysicsBriefly() {
            if (physicsFrozen) network.setOptions({ physics: { enabled: true } });
            clearTimeout(thawTimeout);
            thawTimeout = setTimeout(() => {
                network.setOptions({ physics: { enabled: false } });
            }, 1500); // settle window after a burst of additions
        }
        // Level-of-detail: hide labels/arrows when zoomed out 
        // Text measurement + arrowhead drawing is real canvas cost at high
        // node counts and is illegible at low zoom anyway, so strip it
        // instead of paying for it.
        let lodLabelsHidden = false;
        const LOD_ZOOM_THRESHOLD = 0.35;
        network.on('zoom', () => {
            const scale = network.getScale();
            const shouldHide = scale < LOD_ZOOM_THRESHOLD;
            if (shouldHide === lodLabelsHidden) return;
            lodLabelsHidden = shouldHide;
            network.setOptions({
                nodes: { font: { size: shouldHide ? 0 : 12 } },
                edges: { arrows: { to: { enabled: !shouldHide } }, font: { size: shouldHide ? 0 : 10 } }
            });
        });
        
        // Helper functions
        function getNodeColor(nodeData) {
            const type = nodeData.type;
            const score = parseInt(nodeData.security_score) || 0;
            
            // File nodes
            if (type === 'file_binary') {
                return {
                    background: '#FF8C00',
                    border: '#CC7000',
                    highlight: { background: '#FFB347', border: '#FF8C00' },
                    hover: { background: '#FFB347', border: '#FF8C00' }
                };
            }
            if (type === 'file_data') {
                return {
                    background: '#90EE90',
                    border: '#32CD32',
                    highlight: { background: '#98FB98', border: '#00FF00' },
                    hover: { background: '#98FB98', border: '#00FF00' }
                };
            }
            
            // Network nodes
            if (type === 'network_socket') {
                return {
                    background: '#87CEEB',
                    border: '#4682B4',
                    highlight: { background: '#B0E0E6', border: '#1E90FF' },
                    hover: { background: '#B0E0E6', border: '#1E90FF' }
                };
            }
            
            // Process nodes - color by security score with gradient
            if (score === 0) {
                return {
                    background: '#97C2FC',
                    border: '#2B7CE9',
                    highlight: { background: '#D2E5FF', border: '#2B7CE9' },
                    hover: { background: '#D2E5FF', border: '#2B7CE9' }
                };
            }
            if (score < 30) {
                return {
                    background: '#FFD700',
                    border: '#DAA520',
                    highlight: { background: '#FFED4E', border: '#FFD700' },
                    hover: { background: '#FFED4E', border: '#FFD700' }
                };
            }
            if (score < 100) {
                return {
                    background: '#FF8C00',
                    border: '#FF4500',
                    highlight: { background: '#FFA500', border: '#FF4500' },
                    hover: { background: '#FFA500', border: '#FF4500' }
                };
            }
            // High risk
            return {
                background: '#FF0000',
                border: '#8B0000',
                highlight: { background: '#FF4444', border: '#8B0000' },
                hover: { background: '#FF4444', border: '#8B0000' }
            };
        }
        
        function getNodeSize(nodeData) {
            const type = nodeData.type;
            const score = parseInt(nodeData.security_score) || 0;
            
            // Smaller base sizes for better performance
            if (type === 'process') {
                return Math.max(15, 18 + Math.min(score / 3, 25));
            } else if (type === 'file_binary') {
                return 14;
            } else if (type === 'file_data') {
                return 12;
            } else if (type === 'network_socket') {
                return 15;
            }
            return 12;
        }
        
        function getNodeLabel(nodeData) {
            const type = nodeData.type;
            
            if (type === 'process') {
                const comm = nodeData.comm || 'unknown';
                const pid = nodeData.pid || '';
                const score = parseInt(nodeData.security_score) || 0;
                
                if (score >= 100) {
                    return `🚨 ${comm}`;
                } else if (score >= 30) {
                    return `⚠️ ${comm}`;
                } else if (score > 0) {
                    return `⚡ ${comm}`;
                }
                return comm;
            }
            
            if (type === 'file_binary' || type === 'file_data') {
                const pathStr = nodeData.id ? String(nodeData.id) : '';
                const parts = pathStr.split('/');
                const filename = parts[parts.length - 1] || pathStr;
                
                // Truncate long filenames
                if (filename.length > 20) {
                    return filename.substring(0, 17) + '...';
                }
                return filename;
            }
            
            if (type === 'network_socket') {
                const sockStr = nodeData.id || '';
                const parts = sockStr.split(':');
                if (parts.length === 2) {
                    const ip = parts[0];
                    const port = parts[1];
                    // Shorten IPs for readability
                    const ipParts = ip.split('.');
                    if (ipParts.length === 4) {
                        return `${ipParts[0]}.${ipParts[1]}...:${port}`;
                    }
                }
                return sockStr.substring(0, 15);
            }
            
            return String(nodeData.id).substring(0, 15);
        }
        
        function getNodeTitle(nodeData) {
            const type = nodeData.type;
            let title = `<b>${type}</b><br>`;
            
            if (type === 'process') {
                title += `Command: ${nodeData.comm || 'N/A'}<br>`;
                title += `PID: ${nodeData.pid || 'N/A'}<br>`;
                
                const score = parseInt(nodeData.security_score) || 0;
                if (score > 0) {
                    title += `<br><b style="color: #ff4444;">Security Score: ${score}</b><br>`;
                    
                    if (nodeData.has_fd_redirect) title += '🚨 FD Redirect (Reverse Shell)<br>';
                    if (nodeData.has_memfd_create) title += `💾 Memfd Create (${nodeData.memfd_count}x)<br>`;
                    if (nodeData.has_raw_socket) title += '📡 Raw Socket<br>';
                    if (nodeData.has_rwx_mprotect) title += `⚡ RWX Mprotect (${nodeData.mprotect_rwx_count}x)<br>`;
                    if (nodeData.has_ptrace) title += `🔍 Ptrace (${nodeData.ptrace_count}x)<br>`;
                    if (nodeData.escalated_to_root) title += '👑 Privilege Escalation to Root<br>';
                    if (nodeData.has_file_deletion) title += `🗑️ File Deletion (${nodeData.unlink_count}x)<br>`;
                    if (nodeData.has_setuid_chmod) title += '🔓 Setuid Chmod<br>';
                    if (nodeData.has_module_load) title += `🔌 Module Load (${nodeData.module_load_count}x)<br>`;
                }
            } else if (type === 'network_socket') {
                title += `IP: ${nodeData.ip || 'N/A'}<br>Port: ${nodeData.port || 'N/A'}`;
            } else {
                title += `${nodeData.id || 'N/A'}`;
            }
            
            return title;
        }
        
        // Lightweight "pop-in" for new nodes (liveliness without physics) 
        // Instead of running a continuous force simulation over the whole
        // graph, we just animate the ONE node that was just inserted: it
        // grows from size 1 to its target size over ~250ms via a single
        // requestAnimationFrame loop. Cost is O(1) per new node, not O(n)
        // per frame, so it stays cheap regardless of total graph size.
        function easeOutBack(x) {
            const c1 = 1.70158, c3 = c1 + 1;
            return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
        }
        function popInNodes(nodeIds) {
            const targets = {};
            nodeIds.forEach(id => {
                const n = nodes.get(id);
                if (n) targets[id] = n.size || 15;
            });
            if (Object.keys(targets).length === 0) return;

            // Shrink them immediately, then animate growth
            nodes.update(nodeIds.map(id => ({ id, size: 1 })));
            const t0 = performance.now();
            const DURATION = 250;
            function grow(now) {
                const p = Math.min(1, (now - t0) / DURATION);
                const eased = easeOutBack(p);
                nodes.update(nodeIds.map(id => ({ id, size: Math.max(1, 1 + (targets[id] - 1) * eased) })));
                if (p < 1) requestAnimationFrame(grow);
            }
            requestAnimationFrame(grow);
        }

        // Process batched updates for better performance
        function processBatch() {
            if (updateBatch.nodes.length > 0 || updateBatch.edges.length > 0) {
                // Process all nodes in one operation
                if (updateBatch.nodes.length > 0) {
                    const nodesToAdd = [];
                    const nodesToUpdate = [];
                    
                    updateBatch.nodes.forEach(nodeData => {
                        const nodeObj = {
                            id: nodeData.id,
                            label: getNodeLabel(nodeData.data),
                            color: getNodeColor(nodeData.data),
                            size: getNodeSize(nodeData.data),
                            title: getNodeTitle(nodeData.data),
                            ...nodeData.data
                        };
                        
                        if (nodes.get(nodeData.id)) {
                            nodesToUpdate.push(nodeObj);
                        } else {
                            nodesToAdd.push(nodeObj);
                        }
                    });
                    
                    if (nodesToAdd.length > 0) {
                        nodes.add(nodesToAdd);
                        thawPhysicsBriefly();
                        // Only pop-in a bounded number per batch — if a huge
                        // burst arrives (e.g. initial load piggybacking on
                        // this path), skip the animation entirely so we
                        // never stack up hundreds of RAF loops at once.
                        if (nodesToAdd.length <= 40) {
                            popInNodes(nodesToAdd.map(n => n.id));
                        }
                    }
                    if (nodesToUpdate.length > 0) nodes.update(nodesToUpdate);
                }
                
                // Process all edges in one operation
                if (updateBatch.edges.length > 0) {
                    const edgesToAdd = [];
                    const edgesToUpdate = [];
                    
                    updateBatch.edges.forEach(edgeData => {
                        const edgeId = `${edgeData.source}-${edgeData.target}`;
                        const edgeObj = {
                            id: edgeId,
                            from: edgeData.source,
                            to: edgeData.target,
                            title: edgeData.data.relation || '',
                            ...edgeData.data
                        };
                        
                        if (edges.get(edgeId)) {
                            edgesToUpdate.push(edgeObj);
                        } else {
                            edgesToAdd.push(edgeObj);
                        }
                    });
                    
                    if (edgesToAdd.length > 0) edges.add(edgesToAdd);
                    if (edgesToUpdate.length > 0) edges.update(edgesToUpdate);
                }
                
                // Clear batch
                updateBatch = { nodes: [], edges: [], timestamp: Date.now() };
            }
            batchTimeout = null;
        }
        
        function addNode(nodeData) {
            // Add to batch instead of applying immediately
            updateBatch.nodes.push(nodeData);
            
            // Schedule batch processing
            if (!batchTimeout) {
                batchTimeout = setTimeout(processBatch, BATCH_DELAY_MS);
            }
        }
        
        function updateNode(nodeData) {
            // Add to batch (will be handled as update in processBatch)
            updateBatch.nodes.push(nodeData);
            
            if (!batchTimeout) {
                batchTimeout = setTimeout(processBatch, BATCH_DELAY_MS);
            }
        }
        
        function addEdge(edgeData) {
            // Add to batch instead of applying immediately
            updateBatch.edges.push(edgeData);
            
            if (!batchTimeout) {
                batchTimeout = setTimeout(processBatch, BATCH_DELAY_MS);
            }
        }
        
        function logEvent(message, type = 'normal') {
            const log = document.getElementById('event-log');
            const entry = document.createElement('div');
            entry.className = `event-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.insertBefore(entry, log.firstChild);
            
            // Keep only last 50 entries
            while (log.children.length > 50) {
                log.removeChild(log.lastChild);
            }
        }
        
        // Socket event handlers
        socket.on('connect', () => {
            console.log('Connected to K-Guard server');
            document.getElementById('status-indicator').classList.add('connected');
            document.getElementById('connection-status').classList.remove('show');
            reconnectAttempts = 0;
            logEvent('✓ Connected to server', 'normal');
        });
        
        socket.on('disconnect', (reason) => {
            console.log('Disconnected from server:', reason);
            document.getElementById('status-indicator').classList.remove('connected');
            document.getElementById('connection-status').classList.add('show');
            logEvent('✗ Disconnected: ' + reason, 'security');
        });
        
        socket.on('connect_error', (error) => {
            reconnectAttempts++;
            console.error('Connection error:', error);
            if (reconnectAttempts <= 3) {
                logEvent(`Reconnecting... (attempt ${reconnectAttempts})`, 'security');
            }
        });
        
        socket.on('reconnect', (attemptNumber) => {
            console.log('Reconnected after', attemptNumber, 'attempts');
            logEvent(`✓ Reconnected after ${attemptNumber} attempts`, 'normal');
        });
        
        socket.on('error', (error) => {
            console.error('Socket error:', error);
            logEvent('⚠️ Server error: ' + (error.message || 'Unknown'), 'security');
        });
        
        socket.on('initial_state', (data) => {
            console.log('Received initial state:', data);
            
            try {
                // Clear existing data
                nodes.clear();
                edges.clear();
                
                // Add all nodes (with error handling for large datasets)
                const nodesToAdd = [];
                data.nodes.forEach(node => {
                    try {
                        const nodeData = node.data;
                        nodesToAdd.push({
                            id: node.id,
                            label: getNodeLabel(nodeData),
                            color: getNodeColor(nodeData),
                            size: getNodeSize(nodeData),
                            title: getNodeTitle(nodeData),
                            ...nodeData
                        });
                    } catch (e) {
                        console.error('Error processing node:', node, e);
                    }
                });
                nodes.add(nodesToAdd);
                
                // Add all edges
                const edgesToAdd = [];
                data.edges.forEach(edge => {
                    try {
                        edgesToAdd.push({
                            id: `${edge.source}-${edge.target}`,
                            from: edge.source,
                            to: edge.target,
                            title: edge.data.relation || '',
                            ...edge.data
                        });
                    } catch (e) {
                        console.error('Error processing edge:', edge, e);
                    }
                });
                edges.add(edgesToAdd);
                
                // Update stats
                updateStats(data.stats);
                
                logEvent(`✓ Loaded ${data.nodes.length} nodes, ${data.edges.length} edges`, 'normal');
                
                // Auto-fit after initial load
                setTimeout(() => network.fit(), 500);
            } catch (e) {
                console.error('Error loading initial state:', e);
                logEvent('⚠️ Error loading graph state', 'security');
            }
        });
        
        socket.on('initial_state_chunk', (data) => {
            console.log(`Received chunk ${data.chunk}, last: ${data.is_last}`);
            
            try {
                // Add nodes from chunk
                data.nodes.forEach(node => addNode(node));
                data.edges.forEach(edge => addEdge(edge));
                
                if (data.is_last) {
                    logEvent(`✓ Loaded large graph in chunks`, 'normal');
                    setTimeout(() => network.fit(), 500);
                }
            } catch (e) {
                console.error('Error loading chunk:', e);
            }
        });
        
        socket.on('graph_update', (data) => {
            lastUpdateTime = Date.now();
            
            if (isPaused) {
                queuedUpdates.push(data);
                return;
            }
            
            try {
                applyUpdate(data);
            } catch (e) {
                console.error('Error applying update:', e);
                logEvent('⚠️ Error processing update', 'security');
            }
        });
        
        socket.on('nodes_deleted', (data) => {
            try {
                const nodesToRemove = [];
                data.nodes.forEach(nodeId => {
                    if (nodes.get(nodeId)) {
                        nodesToRemove.push(nodeId);
                    }
                });
                if (nodesToRemove.length > 0) {
                    nodes.remove(nodesToRemove);
                    logEvent(`🗑️ Pruned ${nodesToRemove.length} stale nodes`, 'normal');
                }
            } catch (e) {
                console.error('Error removing nodes:', e);
            }
        });
        
        function applyUpdate(data) {
            // Add new nodes (with deduplication)
            if (data.nodes_added && data.nodes_added.length > 0) {
                data.nodes_added.forEach(node => {
                    try {
                        addNode(node);
                        const type = node.data.type;
                        if (type === 'process') {
                            logEvent(`Process: ${node.data.comm} (PID ${node.data.pid})`, 'normal');
                        } else if (type === 'network_socket') {
                            logEvent(`Network: ${node.id}`, 'network');
                        } else if (type === 'file_data' || type === 'file_binary') {
                            logEvent(`File: ${node.id}`, 'file');
                        }
                    } catch (e) {
                        console.warn('Skipping duplicate node:', node.id);
                    }
                });
            }
            
            // Add new edges (with deduplication)
            if (data.edges_added && data.edges_added.length > 0) {
                data.edges_added.forEach(edge => {
                    try {
                        addEdge(edge);
                    } catch (e) {
                        console.warn('Skipping duplicate edge:', edge.source, '->', edge.target);
                    }
                });
            }
            
            // Update existing nodes
            if (data.nodes_updated && data.nodes_updated.length > 0) {
                data.nodes_updated.forEach(node => {
                    try {
                        updateNode(node);
                        const score = parseInt(node.data.security_score) || 0;
                        if (score > 50) {
                            logEvent(`⚠️ HIGH RISK: ${node.data.comm} (Score: ${score})`, 'security');
                        }
                    } catch (e) {
                        console.error('Error updating node:', node.id, e);
                    }
                });
            }
            
            // Update stats
            if (data.stats) {
                updateStats(data.stats);
            }
        }
        
        function updateStats(stats) {
            document.getElementById('node-count').textContent = stats.total_nodes || 0;
            document.getElementById('edge-count').textContent = stats.total_edges || 0;
            document.getElementById('event-count').textContent = stats.total_events || 0;
            document.getElementById('event-rate').textContent = stats.events_per_sec || 0;
        }
        
        function togglePause() {
            isPaused = !isPaused;
            const btn = document.getElementById('pause-btn');
            
            if (isPaused) {
                btn.textContent = '▶️ Resume';
                btn.classList.add('active');
                logEvent('Monitoring paused', 'normal');
            } else {
                btn.textContent = '⏸ Pause';
                btn.classList.remove('active');
                
                // Apply queued updates
                queuedUpdates.forEach(update => applyUpdate(update));
                queuedUpdates = [];
                
                logEvent('Monitoring resumed', 'normal');
            }
        }
        
        function clearGraph() {
            if (confirm('Clear all graph data? This cannot be undone.')) {
                nodes.clear();
                edges.clear();
                logEvent('Graph cleared', 'security');
            }
        }
        
        function resetZoom() {
            network.fit({
                animation: {
                    duration: 1000,
                    easingFunction: 'easeInOutQuad'
                }
            });
            logEvent('View reset', 'normal');
        }
        
        // Re-run the hierarchical layout pass. This is NOT physics — it's a
        // single deterministic topological positioning pass, so it's cheap
        // even on a large graph. Useful if manual dragging has left nodes
        // out of place, or after a big burst of additions.
        function reflowGraph() {
            const btn = document.getElementById('physics-btn');
            btn.classList.add('active');
            btn.textContent = '🔄 Re-flowing...';
            network.setOptions({ physics: { enabled: true } });
            network.stabilize(150);
            network.once('stabilizationIterationsDone', () => {
                network.setOptions({ physics: { enabled: false } });
                network.fit({ animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
                btn.classList.remove('active');
                btn.textContent = '🔄 Re-flow';
            });
            logEvent('Graph re-flowed', 'normal');
        }
        
        // Bounded visible node count via clustering 
        // Hierarchical layout + LOD keeps rendering cheap per-node, but at
        // several thousand simultaneous nodes the sheer paint area gets
        // dense regardless. Rather than limit graph history, we visually
        // collapse "leaf" nodes (single-connection files/sockets hanging
        // off a process — usually the bulk of node count) into their
        // parent process once the graph is large. Double-click a
        // collapsed cluster to expand it back.
        const CLUSTER_TRIGGER_NODE_COUNT = 400;
        let clusteringInFlight = false;

        function runIdleClustering() {
            if (clusteringInFlight) return;
            if (nodes.length < CLUSTER_TRIGGER_NODE_COUNT) return;
            clusteringInFlight = true;
            try {
                network.clusterOutliers({
                    clusterNodeProperties: {
                        shape: 'hexagon',
                        color: { background: '#3a3a3a', border: '#666666' },
                        font: { size: lodLabelsHidden ? 0 : 12, color: '#cccccc' },
                        borderWidth: 2
                    },
                    processProperties: (clusterOptions, childNodes) => {
                        clusterOptions.label = `+${childNodes.length}`;
                        return clusterOptions;
                    }
                });
            } catch (e) {
                console.warn('Clustering pass skipped:', e);
            } finally {
                clusteringInFlight = false;
            }
        }

        // Expand a cluster back into its individual nodes on double-click
        network.on('doubleClick', (params) => {
            if (params.nodes.length !== 1) return;
            const nodeId = params.nodes[0];
            if (network.isCluster(nodeId)) {
                network.openCluster(nodeId);
            }
        });

        // Re-run periodically rather than on every update — clustering the
        // whole graph is an O(n) pass and doesn't need to happen per-event
        setInterval(runIdleClustering, 20000);

        // Monitor connection health
        setInterval(() => {
            const timeSinceUpdate = Date.now() - lastUpdateTime;
            if (socket.connected && timeSinceUpdate > 30000) {
                logEvent('⚠️ No updates for 30s, connection may be stalled', 'security');
            }
        }, 30000);
        
        // Performance monitoring - reduced frequency
        let frameCount = 0;
        let lastFpsTime = Date.now();
        setInterval(() => {
            frameCount++;
            const now = Date.now();
            if (now - lastFpsTime > 10000) {  // Check every 10 seconds
                const fps = (frameCount / (now - lastFpsTime)) * 1000;
                if (fps < 20) {
                    console.warn('Low rendering performance:', fps.toFixed(1), 'fps');
                }
                frameCount = 0;
                lastFpsTime = now;
            }
        }, 500);  // Run check every 500ms instead of 100ms
        
        console.log('K-Guard Live Dashboard initialized');
        console.log('WebSocket protocol:', socket.io.engine.transport.name);
    </script>
</body>
